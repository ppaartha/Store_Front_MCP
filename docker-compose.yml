version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: customer_order_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_order_mcp_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
    command: sh -c "python seed.py --migrate && python main.py"
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_order_streamlit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    command: sh -c "python seed.py --migrate && streamlit run app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_order_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer_order_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - API_TARGET=http://api:8001
    ports:
      - "5173:5173"

volumes:
  postgres_data:
